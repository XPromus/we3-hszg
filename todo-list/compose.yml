services:
  todo_list_frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: todo_list_frontend
    networks:
      - todo_network
    ports:
      - "3000:3000"
  todo_list_backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
      args:
        APP_VERSION: "0.0.1-SNAPSHOT"
    container_name: todo_list_backend
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://todo_list_db:5432/todo_db
      - SPRING_DATASOURCE_USERNAME=todo
      - SPRING_DATASOURCE_PASSWORD=todo
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
    networks:
      - todo_network
    ports:
      - "8080:8080"
  db:
    image: postgres
    container_name: todo_list_db
    environment:
      - POSTGRES_USER=todo
      - POSTGRES_PASSWORD=todo
      - POSTGRES_DB=todo_db
    networks:
      - todo_network
    ports:
      - "5432:5432"

networks:
  todo_network:
    driver: bridge
